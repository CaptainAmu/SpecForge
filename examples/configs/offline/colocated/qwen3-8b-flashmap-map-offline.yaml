# FlashMap stage 2: distil the stage-1 flow into the one-step flow map that is
# served. The map starts as a copy of the flow; the frozen flow is the
# semigroup objective's diagonal teacher. Export the result with
#   specforge export --to hf --draft-config configs/qwen3-8b-flashmap.json ...
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config: configs/qwen3-8b-flashmap.json
  flashmap_flow_checkpoint: ./outputs/qwen3-8b-flashmap-flow-offline
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  hidden_states_path: ./cache/hidden_states/qwen3-8b-flashmap-perfectblend
  max_length: 4096
  chat_template: qwen
  cache_dir: ./cache

training:
  strategy: flashmap
  flashmap_stage: map
  flashmap_diagonal_fraction: 0.5
  flashmap_boundary_prob: 0.0625
  flashmap_antithetic_sampling: true
  num_epochs: 12
  batch_size: 1
  accumulation_steps: 32
  learning_rate: 5.0e-5
  warmup_ratio: 0.04
  lr_scheduler: wsd
  lr_decay_ratio: 0.2
  adam_beta2: 0.95
  fsdp_sharding: NO_SHARD
  max_grad_norm: 1.0
  attention_backend: flex_attention
  # Each step evaluates the map three times on vocabulary-sized states, so it
  # draws fewer blocks than the flow.
  num_anchors: 128
  loss_decay_gamma: 7.0
  save_interval: 1000
  log_interval: 10
  dist_timeout: 30
  seed: 42

run_id: qwen3-8b-flashmap-map-offline
output_dir: ./outputs/qwen3-8b-flashmap-map-offline

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 8
