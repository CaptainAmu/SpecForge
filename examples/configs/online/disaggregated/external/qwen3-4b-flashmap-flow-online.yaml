model:
  target_model_path: "Qwen/Qwen3-4B"
  draft_model_config: "configs/qwen3-4b-flashmap.json"
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/perfectblend_qwen3-4b_regen.jsonl"
  max_length: 4096
  chat_template: "qwen"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "flashmap"
  flashmap_stage: "flow"
  num_epochs: 20
  learning_rate: 0.0006
  num_anchors: 512
  batch_size: 1
  accumulation_steps: 32
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  loss_decay_gamma: 7
  save_interval: 1000
  log_interval: 10
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "wandb"
  wandb_project: "specforge-qwen3-4b-flashmap"
  wandb_name: "qwen3-4b-flashmap-flow-perfectblend"
run_id: "qwen3-4b-flashmap-flow-online"
output_dir: "./outputs/qwen3-4b-flashmap-flow-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3-4b-flashmap-flow-online/control
    consumer_state_dir: outputs/qwen3-4b-flashmap-flow-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
